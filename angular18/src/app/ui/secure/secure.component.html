<div style="padding-bottom: 3% !important;">
    <div class="container-fluid">
     
        <div class="row">
            <app-header style="padding: 0 !important;"></app-header>
        </div>
     
        <div class="row">
            <app-sidebar style="width: 20%;padding: 20px;min-height: 700px;height:auto"></app-sidebar>
            <div class="appBody" style="width: 80%;">
 
                <nav aria-label='breadcrumb' style="background-color: #e9ecef;">
                    <ol class='breadcrumb' style="padding-top: 10px; padding-bottom: 10px;">                        
                        <li  *ngFor="let obj of breadcrumpList; let i = index" key="i" style="margin-left: 10px;display:flex;font-weight: bold;color:gray">
                         <a style="text-transform: capitalize;" (click)="onClickRedirect(obj.redirectUrl)"> {{obj.name}}</a>
                         <span [style.display]="breadcrumpList.length-1 == i ? 'none' : ''"  style="font-size: 25px; margin-left: 6px; font-weight: normal;">></span>
                         </li>
                    </ol>
                </nav>
                <router-outlet></router-outlet>
            </div>
        </div>    
    </div>
</div>
<app-footer style="position: fixed;bottom: 0; width: 100% !important;"></app-footer>
